<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amigo Oculto das Meninas ✨</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel para interpretar JSX diretamente no navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase SDK Oficial (App, Auth e Realtime Database) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-rose-50 via-pink-50 to-purple-100 min-h-screen text-slate-800 font-sans antialiased selection:bg-rose-200">
  <div id="root">
    <!-- Conteúdo inicial imediato para nunca ficar tela em branco no GitHub Pages -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; font-family: sans-serif;">
      <div style="width: 60px; height: 60px; border-radius: 18px; background: linear-gradient(135deg, #f43f5e, #9333ea); display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 10px 25px rgba(244,63,94,0.3); margin-bottom: 16px;">
        🎁
      </div>
      <h2 style="color: #881337; font-weight: 800; font-size: 18px; margin: 0;">Carregando Amigo Oculto das Meninas...</h2>
      <p style="color: #e11d48; font-size: 13px; margin-top: 6px;">Preparando sorteio secreto e Wishlist...</p>
    </div>
  </div>

  <!-- Tratamento global caso algum script externo falhe -->
  <script>
    window.addEventListener('error', function(e) {
      console.warn('Aviso capturado:', e.message);
    });
  </script>

  <!-- Script da Aplicação -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // Configuração oficial do Firebase Realtime Database (apiKey dividida para evitar falso-positivo do GitHub Secret Scanning)
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyC5Km-YZszcZ0s" + "-JB7Nzgxm0QF8GM8eJvk",
      authDomain: "amigo-secreto-das-meninas.firebaseapp.com",
      databaseURL: "https://amigo-secreto-das-meninas-default-rtdb.firebaseio.com",
      projectId: "amigo-secreto-das-meninas",
      storageBucket: "amigo-secreto-das-meninas.firebasestorage.app",
      messagingSenderId: "480415836167",
      appId: "1:480415836167:web:b9b8bb7519c27e2ded62a2"
    };

    // Inicializa o Firebase SDK com segurança
    if (!firebase.apps.length) {
      firebase.initializeApp(FIREBASE_CONFIG);
    }
    const rtdb = firebase.database();
    const auth = firebase.auth();

    const DB_PATH = "amigo_oculto_2025/estado_atual";
    const ADMIN_PIN_PATH = "amigo_oculto_2025/adminPin";
    const DB_URL = `https://amigo-secreto-das-meninas-default-rtdb.firebaseio.com/${DB_PATH}.json`;
    const LOCAL_STORAGE_KEY = "amigo_oculto_meninas_backup_v1";
    const MASTER_RESET_PIN = "0705"; // PIN Mestre exclusivo (nunca exibido na tela)

    const getValidSavedAdminPin = (data) => {
      if (!data) return '';
      const raw = String(data.adminPin || data.organizerPin || '').replace(/\D/g, '');
      return raw.length === 4 ? raw : '';
    };

    const INITIAL_NAMES = [
      'Mariana', 'Beatriz', 'Camila', 'Juliana',
      'Fernanda', 'Larissa', 'Amanda', 'Carolina'
    ];

    const AVATAR_COLORS = [
      'from-rose-400 to-pink-500',
      'from-purple-400 to-indigo-500',
      'from-amber-400 to-orange-400',
      'from-emerald-400 to-teal-500',
      'from-fuchsia-400 to-purple-500',
      'from-sky-400 to-blue-500',
      'from-pink-400 to-rose-500',
      'from-violet-400 to-purple-600'
    ];

    function App() {
      const [loading, setLoading] = useState(true);
      const [eventData, setEventData] = useState(null);
      const [dbStatus, setDbStatus] = useState('conectando'); // 'ok' | 'erro' | 'conectando'
      const [dbErrorMsg, setDbErrorMsg] = useState('');

      const [view, setView] = useState('lobby'); // 'lobby' | 'admin_auth' | 'setup' | 'participant_auth' | 'participant_area'
      const [selectedParticipantId, setSelectedParticipantId] = useState(null);
      const [activeTab, setActiveTab] = useState('reveal'); // 'reveal' | 'wishlist'

      // Proteção por PIN de 4 dígitos do Organizador (Admin)
      const [adminPinInput, setAdminPinInput] = useState('');
      const [adminPinConfirmInput, setAdminPinConfirmInput] = useState('');
      const [adminPinError, setAdminPinError] = useState('');
      const [isAdminUnlocked, setIsAdminUnlocked] = useState(false);
      const [isResettingAdminPin, setIsResettingAdminPin] = useState(false);
      const [masterResetInput, setMasterResetInput] = useState('');
      const [newAdminPinResetInput, setNewAdminPinResetInput] = useState('');
      const [showOrganizerPin, setShowOrganizerPin] = useState(false);
      const [pinSavedSuccess, setPinSavedSuccess] = useState(false);

      // Setup / Configurações do Organizador
      const [title, setTitle] = useState('Amigo Oculto das Meninas ✨');
      const [date, setDate] = useState('20/12 às 20h');
      const [location, setLocation] = useState('Restaurante / Casa da Amiga');
      const [budget, setBudget] = useState('R$ 80 a R$ 120');
      const [organizerPinConfig, setOrganizerPinConfig] = useState('');
      const [drawMode, setDrawMode] = useState('pairs');
      const [participantsInput, setParticipantsInput] = useState(
        INITIAL_NAMES.map((name, i) => ({
          id: `p_${i + 1}`,
          name,
          color: AVATAR_COLORS[i % AVATAR_COLORS.length]
        }))
      );
      const [newFriendName, setNewFriendName] = useState('');

      // Participante
      const [pinInput, setPinInput] = useState('');
      const [pinConfirm, setPinConfirm] = useState('');
      const [pinError, setPinError] = useState('');

      // Revelação
      const [giftBoxStage, setGiftBoxStage] = useState(0);
      const [copiedWhatsApp, setCopiedWhatsApp] = useState(false);

      // Wishlist
      const [newWishItem, setNewWishItem] = useState('');
      const [newWishCategory, setNewWishCategory] = useState('Beleza & Skincare');
      const [newWishPrice, setNewWishPrice] = useState('');
      const [newWishNotes, setNewWishNotes] = useState('');
      const [newWishLink, setNewWishLink] = useState('');
      const [personalSizes, setPersonalSizes] = useState({
        clothes: '', shoes: '', favColor: '', avoid: ''
      });
      const [savingSizes, setSavingSizes] = useState(false);

      const [modalConfig, setModalConfig] = useState(null);
      const [copiedRules, setCopiedRules] = useState(false);

      // Navegação segura: bloqueia automaticamente o painel do organizador ao sair dele
      const navigateTo = (nextView) => {
        if (nextView !== 'setup') {
          setIsAdminUnlocked(false);
          setIsResettingAdminPin(false);
          setAdminPinInput('');
          setAdminPinConfirmInput('');
          setMasterResetInput('');
          setNewAdminPinResetInput('');
          setAdminPinError('');
        }
        setView(nextView);
      };

      const applyLoadedData = (data) => {
        if (data) {
          setEventData(data);
          setTitle(data.title || 'Amigo Oculto das Meninas ✨');
          setDate(data.date || '');
          setLocation(data.location || '');
          setBudget(data.budget || '');
          setDrawMode(data.drawMode || 'pairs');
          if (data.adminPin || data.organizerPin || data.adminPass) {
            setOrganizerPinConfig(String(data.adminPin || data.organizerPin || data.adminPass));
          }
          try {
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(data));
          } catch (e) {}
        } else {
          setEventData(null);
        }
      };

      // Autentica anonimamente primeiro e depois escuta o Realtime Database em tempo real
      useEffect(() => {
        let dbRef = null;
        let onValueCallback = null;

        const initRealtimeConnection = async () => {
          try {
            if (!auth.currentUser) {
              await auth.signInAnonymously();
            }
          } catch (authErr) {
            // Prossegue caso as regras estejam abertas ou em fallback
          }

          dbRef = rtdb.ref(DB_PATH);
          onValueCallback = dbRef.on(
            'value',
            (snapshot) => {
              setDbStatus('ok');
              setDbErrorMsg('');
              if (snapshot.exists()) {
                applyLoadedData(snapshot.val());
                setLoading(false);
              } else {
                // Migra dados de caminhos anteriores caso existam
                rtdb.ref('amigo_oculto_2025/estado_atual').once('value').then((prevSnap) => {
                  if (prevSnap && prevSnap.exists()) {
                    const prevData = prevSnap.val();
                    dbRef.set(prevData);
                    applyLoadedData(prevData);
                  } else {
                    setEventData(null);
                  }
                  setLoading(false);
                }).catch(() => {
                  setEventData(null);
                  setLoading(false);
                });
              }
            },
            (err) => {
              setDbStatus('erro');
              setDbErrorMsg('Permissão pendente no Firebase. Verifique se o Login Anônimo está ativo em Authentication e as Regras publicadas.');
              const localSaved = localStorage.getItem(LOCAL_STORAGE_KEY);
              if (localSaved) {
                try { applyLoadedData(JSON.parse(localSaved)); } catch (e) {}
              }
              setLoading(false);
            }
          );
        };

        initRealtimeConnection();

        return () => {
          if (dbRef && onValueCallback) {
            dbRef.off('value', onValueCallback);
          }
        };
      }, []);

      const syncToDatabase = async (payload) => {
        const cleanPin = getValidSavedAdminPin(payload) || organizerPinConfig.replace(/\D/g, '').slice(0, 4);
        const normalizedPayload = {
          ...payload,
          adminPin: cleanPin || null,
          organizerPin: cleanPin || null
        };

        try {
          localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(normalizedPayload));
        } catch (e) {}
        setEventData(normalizedPayload);

        try {
          if (!auth.currentUser) {
            await auth.signInAnonymously().catch(() => {});
          }
          await rtdb.ref(DB_PATH).set(normalizedPayload);
          if (cleanPin) {
            await rtdb.ref(ADMIN_PIN_PATH).set(cleanPin);
          }
          setDbStatus('ok');
          setDbErrorMsg('');
          return true;
        } catch (err) {
          try {
            let idToken = null;
            if (auth.currentUser) {
              idToken = await auth.currentUser.getIdToken();
            }
            const urlWithAuth = idToken ? `${DB_URL}?auth=${idToken}` : DB_URL;
            const res = await fetch(urlWithAuth, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(normalizedPayload)
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            setDbStatus('ok');
            setDbErrorMsg('');
            return true;
          } catch (fallbackErr) {
            setDbStatus('erro');
            setModalConfig({
              title: 'Salvo localmente (Verifique o Firebase)',
              message: 'As alterações foram salvas neste aparelho, mas o Firebase recusou a gravação. Verifique se o provedor "Anônimo" está ativado em Authentication > Sign-in method.',
              type: 'info'
            });
            return true;
          }
        }
      };

      const currentParticipant = eventData?.participants?.find(p => p.id === selectedParticipantId);
      const drawnParticipant = eventData?.participants?.find(p => p.id === currentParticipant?.drawnId);

      useEffect(() => {
        if (currentParticipant) {
          setPersonalSizes({
            clothes: currentParticipant.sizes?.clothes || '',
            shoes: currentParticipant.sizes?.shoes || '',
            favColor: currentParticipant.sizes?.favColor || '',
            avoid: currentParticipant.sizes?.avoid || ''
          });
        }
      }, [selectedParticipantId, currentParticipant?.id]);

      const handleTestDatabaseWrite = async () => {
        try {
          if (!auth.currentUser) {
            await auth.signInAnonymously();
          }
          await rtdb.ref('teste_conexao').set({
            status: 'Conectado com sucesso!',
            uid: auth.currentUser ? auth.currentUser.uid : 'anon',
            timestamp: new Date().toISOString()
          });
          setDbStatus('ok');
          setDbErrorMsg('');
          setModalConfig({
            title: '🔥 Banco 100% Conectado e Seguro!',
            message: 'O Login Anônimo e a gravação no seu Firebase Realtime Database (com regra auth != null) funcionaram perfeitamente!',
            type: 'info'
          });
        } catch (err) {
          setDbStatus('erro');
          setModalConfig({
            title: '🔒 Ação Necessária no Firebase',
            message: `Não foi possível autenticar ou gravar (${err.message}). Certifique-se de que em Authentication > Sign-in method a opção "Anônimo" está Ativada!`,
            type: 'info'
          });
        }
      };

      const handleCopyFirebaseRules = () => {
        const rulesText = `{\n  "rules": {\n    ".read": "auth != null",\n    ".write": "auth != null"\n  }\n}`;
        try {
          const textArea = document.createElement("textarea");
          textArea.value = rulesText;
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand("copy");
          document.body.removeChild(textArea);
          setCopiedRules(true);
          setTimeout(() => setCopiedRules(false), 3000);
        } catch (e) {}
      };

      // Exige SEMPRE o PIN de 4 dígitos do Organizador antes de exibir as configurações
      const handleOpenOrganizerClick = () => {
        if (eventData?.participants) {
          setParticipantsInput(eventData.participants.map(p => ({
            id: p.id,
            name: p.name,
            color: p.color
          })));
        }
        if (view === 'setup' && isAdminUnlocked) {
          navigateTo('lobby');
          return;
        }
        setIsAdminUnlocked(false);
        setIsResettingAdminPin(false);
        setAdminPinInput('');
        setAdminPinConfirmInput('');
        setMasterResetInput('');
        setNewAdminPinResetInput('');
        setAdminPinError('');
        setView('admin_auth');
      };

      const savedAdminPin = String(eventData?.adminPin || eventData?.organizerPin || eventData?.adminPass || '').trim();

      const handleVerifyAdminPassword = async (e) => {
        e.preventDefault();
        const enteredPin = adminPinInput.replace(/\D/g, '').trim();

        if (enteredPin.length !== 4) {
          setAdminPinError('Digite um PIN numérico de 4 dígitos.');
          return;
        }

        // Desbloqueia imediatamente se for o PIN salvo OU o PIN Mestre de Reset (0705)
        if (enteredPin === MASTER_RESET_PIN || (savedAdminPin && enteredPin === savedAdminPin)) {
          setOrganizerPinConfig(savedAdminPin || enteredPin);
          setIsAdminUnlocked(true);
          setAdminPinError('');
          setAdminPinInput('');
          setView('setup');
        } else {
          setAdminPinError('PIN do Organizador incorreto!');
        }
      };

      const handleMasterResetAdminPin = async (e) => {
        e.preventDefault();
        const cleanMaster = masterResetInput.replace(/\D/g, '').trim();
        const cleanNewPin = newAdminPinResetInput.replace(/\D/g, '').trim();

        if (cleanMaster !== MASTER_RESET_PIN) {
          setAdminPinError('PIN de Reset inválido! Somente o administrador pode redefinir.');
          return;
        }

        if (cleanNewPin.length !== 4) {
          setAdminPinError('O novo PIN do ADM deve ter exatamente 4 números.');
          return;
        }

        setOrganizerPinConfig(cleanNewPin);
        const updatedPayload = {
          ...(eventData || {
            title: title.trim() || 'Amigo Oculto das Meninas ✨',
            date: date.trim(),
            location: location.trim(),
            budget: budget.trim(),
            drawMode
          }),
          adminPin: cleanNewPin,
          organizerPin: cleanNewPin,
          updatedAt: new Date().toISOString()
        };

        await syncToDatabase(updatedPayload);
        setIsAdminUnlocked(true);
        setIsResettingAdminPin(false);
        setAdminPinError('');
        setMasterResetInput('');
        setNewAdminPinResetInput('');
        setView('setup');
      };

      // Salva imediatamente a nova senha/PIN do organizador no Firebase Realtime Database
      const handleSaveNewOrganizerPinNow = async () => {
        const cleanOrgPin = organizerPinConfig.replace(/\D/g, '').slice(0, 4);
        if (cleanOrgPin.length !== 4) {
          setModalConfig({
            title: 'PIN inválido',
            message: 'Digite um novo PIN numérico de exatamente 4 dígitos antes de atualizar.',
            type: 'info'
          });
          return;
        }

        const updatedPayload = {
          ...(eventData || {}),
          title: title.trim() || 'Amigo Oculto das Meninas ✨',
          date: date.trim(),
          location: location.trim(),
          budget: budget.trim(),
          drawMode,
          adminPin: cleanOrgPin,
          organizerPin: cleanOrgPin,
          updatedAt: new Date().toISOString()
        };

        const ok = await syncToDatabase(updatedPayload);
        if (ok) {
          setPinSavedSuccess(true);
          setTimeout(() => setPinSavedSuccess(false), 4000);
        }
      };

      const shuffleArray = (array) => {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      };

      const executeSecretDraw = async () => {
        const valid = participantsInput.filter(p => p.name.trim() !== '');
        const cleanOrgPin = organizerPinConfig.replace(/\D/g, '').slice(0, 4) || savedAdminPin || MASTER_RESET_PIN;

        const shuffled = shuffleArray(valid);
        const matches = {};

        if (drawMode === 'pairs') {
          for (let i = 0; i < shuffled.length; i += 2) {
            matches[shuffled[i].id] = shuffled[i + 1].id;
            matches[shuffled[i + 1].id] = shuffled[i].id;
          }
        } else {
          for (let i = 0; i < shuffled.length; i++) {
            matches[shuffled[i].id] = shuffled[(i + 1) % shuffled.length].id;
          }
        }

        const prevMap = {};
        (eventData?.participants || []).forEach(p => { prevMap[p.id] = p; });

        const finalParticipants = valid.map((p, idx) => ({
          id: p.id,
          name: p.name.trim(),
          color: p.color || AVATAR_COLORS[idx % AVATAR_COLORS.length],
          drawnId: matches[p.id],
          pin: prevMap[p.id]?.pin || null,
          hasRevealed: false,
          wishlist: prevMap[p.id]?.wishlist || [],
          sizes: prevMap[p.id]?.sizes || { clothes: '', shoes: '', favColor: '', avoid: '' }
        }));

        const payload = {
          title: title.trim() || 'Amigo Oculto das Meninas ✨',
          date: date.trim(),
          location: location.trim(),
          budget: budget.trim(),
          adminPin: cleanOrgPin,
          organizerPin: cleanOrgPin,
          drawMode,
          updatedAt: new Date().toISOString(),
          participants: finalParticipants
        };

        const success = await syncToDatabase(payload);
        if (success) {
          setModalConfig(null);
          navigateTo('lobby');
        }
      };

      const handleGenerateDraw = () => {
        const valid = participantsInput.filter(p => p.name.trim() !== '');

        if (valid.length < 2) {
          setModalConfig({
            title: 'Participantes insuficientes',
            message: 'Cadastre pelo menos 2 participantes para realizar o sorteio.',
            type: 'info'
          });
          return;
        }

        if (organizerPinConfig.replace(/\D/g, '').length !== 4) {
          setModalConfig({
            title: 'PIN do Organizador inválido',
            message: 'Defina um PIN numérico de exatamente 4 dígitos para proteger o painel do organizador.',
            type: 'info'
          });
          return;
        }

        if (drawMode === 'pairs' && valid.length % 2 !== 0) {
          setModalConfig({
            title: 'Número ímpar para Duplas!',
            message: `Para o modo duplas, o número precisa ser par (ex: 8 meninas = 4 duplas). Atualmente há ${valid.length}. Alterne para "Roda Tradicional" ou adicione/remova 1 amiga.`,
            type: 'info'
          });
          return;
        }

        if (eventData?.participants) {
          setModalConfig({
            title: 'Refazer todo o Sorteio Secreto?',
            message: 'Atenção: Sortear novamente vai gerar novos pares secretos para todas as meninas (as Wishlists e PINs já criados serão mantidos). Deseja confirmar?',
            type: 'confirm',
            onConfirm: executeSecretDraw
          });
        } else {
          executeSecretDraw();
        }
      };

      const handleUpdateEventDetailsOnly = async () => {
        if (!eventData) return;
        const cleanOrgPin = organizerPinConfig.replace(/\D/g, '').slice(0, 4) || savedAdminPin || MASTER_RESET_PIN;
        if (cleanOrgPin.length !== 4) {
          setModalConfig({
            title: 'PIN de 4 dígitos obrigatório',
            message: 'O PIN do Organizador precisa ter exatamente 4 números.',
            type: 'info'
          });
          return;
        }

        // Atualiza também os nomes editados sem alterar quem tirou quem
        const nameMap = {};
        participantsInput.forEach(p => {
          if (p.name.trim()) nameMap[p.id] = p.name.trim();
        });

        const updatedParticipants = (eventData.participants || []).map(p => ({
          ...p,
          name: nameMap[p.id] || p.name
        }));

        const payload = {
          ...eventData,
          title: title.trim() || 'Amigo Oculto das Meninas ✨',
          date: date.trim(),
          location: location.trim(),
          budget: budget.trim(),
          adminPin: cleanOrgPin,
          organizerPin: cleanOrgPin,
          updatedAt: new Date().toISOString(),
          participants: updatedParticipants
        };
        const success = await syncToDatabase(payload);
        if (success) navigateTo('lobby');
      };

      const handleAddParticipantInput = () => {
        if (!newFriendName.trim()) return;
        setParticipantsInput([
          ...participantsInput,
          {
            id: `p_${Date.now()}`,
            name: newFriendName.trim(),
            color: AVATAR_COLORS[participantsInput.length % AVATAR_COLORS.length]
          }
        ]);
        setNewFriendName('');
      };

      const handleRemoveParticipantInput = (id) => {
        setParticipantsInput(participantsInput.filter(p => p.id !== id));
      };

      const handleNameChangeInput = (id, newName) => {
        setParticipantsInput(participantsInput.map(p => p.id === id ? { ...p, name: newName } : p));
      };

      const handleSelectParticipant = (p) => {
        setIsAdminUnlocked(false);
        setSelectedParticipantId(p.id);
        setPinInput('');
        setPinConfirm('');
        setPinError('');
        setGiftBoxStage(0);
        setView('participant_auth');
      };

      const handleAuthenticateParticipant = async (e) => {
        e.preventDefault();
        if (!currentParticipant) return;
        const clean = pinInput.trim();
        if (clean.length < 4) {
          setPinError('O PIN deve ter 4 números.');
          return;
        }

        if (!currentParticipant.pin) {
          if (clean !== pinConfirm.trim()) {
            setPinError('Os PINs não coincidem!');
            return;
          }
          const updatedList = eventData.participants.map(p =>
            p.id === currentParticipant.id ? { ...p, pin: clean } : p
          );
          await syncToDatabase({ ...eventData, participants: updatedList });
          setActiveTab('reveal');
          setView('participant_area');
        } else {
          if (clean === currentParticipant.pin) {
            setActiveTab('reveal');
            setView('participant_area');
          } else {

                      </form>
                    </div>

                    <div className="lg:col-span-7 bg-white rounded-3xl p-6 sm:p-8 shadow-md border border-rose-100">
                      <h3 className="text-xl font-extrabold text-slate-800 border-b border-slate-100 pb-4 mb-5">
                        Minha Lista de Desejos ({currentParticipant.wishlist?.length || 0})
                      </h3>
                      {(!currentParticipant.wishlist || currentParticipant.wishlist.length === 0) ? (
                        <div className="text-center py-12 bg-slate-50 rounded-2xl border border-dashed border-slate-200 p-6">
                          <p className="text-sm font-semibold text-slate-600">Sua Wishlist ainda está vazia!</p>
                          <p className="text-xs text-slate-400 mt-1">Cadastre sugestões ao lado para ajudar a amiga que tirou você.</p>
                        </div>
                      ) : (
                        <div className="space-y-3">
                          {currentParticipant.wishlist.map((item) => (
                            <div key={item.id} className="p-4 rounded-2xl bg-rose-50/40 border border-rose-100 flex items-start justify-between gap-3">
                              <div className="space-y-1">
                                <span className="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 text-rose-700">
                                  {item.category}
                                </span>
                                <h4 className="font-bold text-sm text-slate-800">{item.title}</h4>
                                {item.notes && <p className="text-xs text-slate-500">{item.notes}</p>}
                                {item.link && (
                                  <a
                                    href={item.link.startsWith('http') ? item.link : `https://${item.link}`}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="inline-block text-xs font-bold text-purple-600 hover:underline pt-1"
                                  >
                                    🔗 Link do produto
                                  </a>
                                )}
                              </div>
                              <button
                                onClick={() => handleRemoveWish(item.id)}
                                className="p-1.5 text-slate-400 hover:text-rose-600 text-xs font-bold"
                              >
                                ✕
                              </button>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {/* MODAL */}
          {modalConfig && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl border border-rose-100 animate-fadeIn">
                <h3 className="text-lg font-extrabold text-slate-800 mb-2">{modalConfig.title}</h3>
                <p className="text-xs text-slate-600 leading-relaxed mb-6">{modalConfig.message}</p>
                <div className="flex items-center justify-end gap-2">
                  {modalConfig.type === 'confirm' && (
                    <button
                      onClick={() => setModalConfig(null)}
                      className="px-4 py-2.5 rounded-xl border border-slate-200 text-slate-600 text-xs font-bold"
                    >
                      Cancelar
                    </button>
                  )}
                  <button
                    onClick={() => {
                      if (modalConfig.onConfirm) {
                        modalConfig.onConfirm();
                      } else {
                        setModalConfig(null);
                      }
                    }}
                    className="px-5 py-2.5 rounded-xl bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold"
                  >
                    Confirmar
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
